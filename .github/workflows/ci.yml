name: RimDoctor - Test, Build and Push
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rimdoctor-ci-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: qwer09872234/rimdoctor
jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run tests inside Linux image
        run: docker build --target test --build-arg APP_VERSION=${{ github.sha }} -t rimdoctor:tests .
      - name: Build runtime image
        run: docker build --target final --build-arg APP_VERSION=${{ github.sha }} -t rimdoctor:ci .
      - name: Verify running service and analyzer
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name rimdoctor-ci-check -p 127.0.0.1:18000:8000 rimdoctor:ci
          trap 'docker logs rimdoctor-ci-check; docker rm -f rimdoctor-ci-check' EXIT
          python3 scripts/smoke.py --version "${{ github.sha }}"
      - name: Sign in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push verified image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          docker tag rimdoctor:ci "$IMAGE:${{ github.sha }}"
          docker tag rimdoctor:ci "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "Published tested image: $IMAGE:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: docker-build-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    concurrency:
      group: rimdoctor-local-deploy
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Desktop
        run: |
          $dockerBin = 'C:\Program Files\Docker\Docker\resources\bin'
          $env:PATH = "$dockerBin;$env:PATH"
          $dockerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          docker info
          if ($LASTEXITCODE -ne 0) { throw 'Start Docker Desktop before deployment' }
      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Deploy and verify service
        env:
          DEPLOY_VERSION: ${{ github.sha }}
        run: ./scripts/deploy-verified.ps1 -Version $env:DEPLOY_VERSION
      - name: Save availability evidence
        if: always() && env.RIMDOCTOR_PROOF != ''
        uses: actions/upload-artifact@v4
        with:
          name: availability-proof
          path: ${{ env.RIMDOCTOR_PROOF }}
          retention-days: 14
